<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEXTORA Email Writer</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-tool="email">

<header class="site-header">
  <a class="brand" href="../index.html">TEXTORA</a>

  <nav class="nav">
    <a href="../index.html#tools">Tools</a>
    <a href="../pricing.html">Pricing</a>
  </nav>
</header>

<main class="tool-page">

  <span class="eyebrow">WRITING ASSISTANT</span>

  <h1>AI Email Writer</h1>

  <p>Create clear and professional emails with TEXTORA.</p>

  <div class="tool-shell single">

    <input
      id="topic"
      placeholder="What is the email about? e.g. Request for leave"
    >

    <div class="form-row">
      <select id="emailType">
        <option>Professional</option>
        <option>Formal</option>
        <option>Friendly</option>
        <option>Job Application</option>
        <option>Follow-up</option>
        <option>Apology</option>
        <option>Request</option>
      </select>

      <select id="level">
        <option>Short</option>
        <option>Medium</option>
        <option>Detailed</option>
      </select>
    </div>

    <textarea
      id="input"
      placeholder="Add any important details..."
    ></textarea>

    <button class="btn" id="run">
      Write Email
    </button>

    <div class="result" id="result">
      Your email will appear here.
    </div>

  </div>

  <div class="notice">
    Review the generated email and personalize names, dates, and other details before sending.
  </div>

</main>

<script src="../assets/js/tool.js"></script>

</body>
</html>
