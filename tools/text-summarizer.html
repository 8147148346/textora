<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEXTORA Text Summarizer</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-tool="summarizer">

<header class="site-header">
<a class="brand" href="../index.html" aria-label="TEXTORA Home">TEXTORA</a>
<button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>
<nav class="nav" aria-label="Main navigation">
<a href="../index.html">Home</a>
<a href="../index.html#tools">AI Tools</a>
<a href="../pricing.html">Pricing</a>
<a href="../about.html">About</a>
<a href="../contact.html">Contact</a>
<a class="btn btn-small" href="../index.html#tools">Start Writing Free</a>
</nav>
</header>

<main class="tool-page">

  <span class="eyebrow">TEXT SUMMARY</span>

  <h1>Text Summarizer</h1>

  <p>
    Turn long text into a clear and concise summary with TEXTORA.
  </p>

  <div class="tool-shell single">

    <textarea
      id="input"
      placeholder="Paste your text here..."
    ></textarea>

    <div class="counter">
      <span id="count">0 characters</span>
    </div>

    <button class="btn" id="run">
      Summarize Text
    </button>

    <div class="result" id="result">
      Your summary will appear here.
    </div>

  </div>

  <div class="notice">
    Review the generated summary and make sure it accurately represents
    the original text.
  </div>

</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/tool.js"></script>

</body>
</html>
