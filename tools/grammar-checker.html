```
<span class="eyebrow">TEXT TOOL</span>

<h1>Grammar Checker</h1>

<p>
  Review grammar, spelling, punctuation and clarity.
</p>

<div class="tool-shell single">

  <label for="input">Your text</label>

  <textarea
    id="input"
    placeholder="Paste your writing here..."
  ></textarea>

  <div class="counter">
    <span id="count">0 characters</span>
  </div>

  <button class="btn" id="run">
    Check Grammar
  </button>

  <div class="result" id="result">
    Suggestions will appear here.
  </div>

  <div class="result-actions">
    <button class="btn btn-small" id="copy">
      Copy
    </button>

    <button class="btn btn-small" id="download">
      Download
    </button>
  </div>

</div>

<div class="notice">
  TEXTORA processes your text through the secure backend.
</div>
