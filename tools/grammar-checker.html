<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEXTORA Grammar Checker</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-tool="grammar">

  <header class="site-header">
<a class="brand" href="../index.html" aria-label="TEXTORA Home">TEXTORA</a>
<button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>
<nav class="nav" aria-label="Main navigation">
<a href="../index.html">Home</a>
<a href="../index.html#tools">AI Tools</a>
<a href="../pricing.html">Pricing</a>
<a href="../about.html">About</a>
<a href="../contact.html">Contact</a>
<a class="btn btn-small" href="../index.html#tools">Start Writing Free</a>
</nav>
</header>

  <main class="tool-page">

<span class="eyebrow">TEXT TOOL</span>

<h1>Grammar Checker</h1>

<p>
  Review grammar, spelling, punctuation and clarity.
</p>

<div class="tool-shell single">

  <label for="input">Your text</label>

  <textarea
    id="input"
    placeholder="Paste your writing here..."
  ></textarea>

  <div class="counter">
    <span id="count">0 characters</span>
  </div>

  <button class="btn" id="run">
    Check Grammar
  </button>

  <div class="result" id="result">
    Suggestions will appear here.
  </div>

  <div class="result-actions">
    <button class="btn btn-small" id="copy">
      Copy
    </button>

    <button class="btn btn-small" id="download">
      Download
    </button>
  </div>

</div>

<div class="notice">
  TEXTORA processes your text through the secure backend.
</div>

  </main>

  <script src="../assets/js/main.js"></script>
<script src="../assets/js/tool.js"></script>

</body>
</html>
